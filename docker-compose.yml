services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: musicwebapp-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - backend_data:/app/data
      # Same host library as Navidrome: manual imports become part of the
      # normal catalogue, while Resonar can play them straight away.
      - /media/music:/music:rw
    networks:
      - default
      - media_default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_MOCK_API: "false"
        NEXT_PUBLIC_API_URL: ""
    container_name: musicwebapp-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default

volumes:
  backend_data:

networks:
  default:
    name: musicwebapp_default
  media_default:
    external: true
