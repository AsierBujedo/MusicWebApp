# Install this file on the server as:
# /etc/nginx/sites-available/resonar.superbitsor.es
#
# It assumes Docker publishes Next.js and FastAPI only on 127.0.0.1.

server {
    listen 80;
    listen [::]:80;
    server_name resonar.superbitsor.es;

    # Required for the initial Let's Encrypt HTTP-01 challenge.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name resonar.superbitsor.es;

    ssl_certificate /etc/letsencrypt/live/resonar.superbitsor.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resonar.superbitsor.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Keep this aligned with MANUAL_UPLOAD_MAX_BYTES in the backend. FLAC files
    # frequently exceed 10 MiB, so Nginx must not reject them before Resonar
    # can validate and retag the audio.
    client_max_body_size 300m;

    # SSE needs an unbuffered, long-lived proxy connection.
    location = /api/events {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
