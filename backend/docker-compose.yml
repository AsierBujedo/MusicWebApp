services:
  api:
    build: .
    ports:
      - "8000:8000"
    # Source of truth for deployment settings. It is ignored by Git and the
    # Docker build context, but is injected into the running container.
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    networks:
      - default
      - media_default
    restart: unless-stopped

networks:
  media_default:
    external: true
